<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <!-- tofu block: isometric cube (front / top / right faces) -->
  <polygon points="16,26 40,26 40,46 16,46" fill="#ffffff"/>
  <polygon points="16,26 40,26 48,20 24,20" fill="#eef2fb"/>
  <polygon points="40,26 48,20 48,40 40,46" fill="#d7ddf0"/>
  <!-- cut lines: a grid of tofu cubes -->
  <g fill="none" stroke="#c3cce6" stroke-width="1.3" stroke-linecap="round">
    <path d="M24 26 V46 M32 26 V46 M16 36 H40"/>
    <path d="M24 26 L32 20 M32 26 L40 20"/>
    <path d="M40 36 L48 30"/>
  </g>
</svg>
